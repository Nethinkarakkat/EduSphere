{% extends "components/base.html" %}
{% block title %}Change Password — EduSphere{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block page_sub %}Update your account password{% endblock %}

{% block content %}
<div class="max-w-md" style="margin:0 auto;">
  <div class="card">
    <div class="card-head"><h5>Change Password</h5></div>
    <div class="card-body">
      <form method="POST" action="/faculty/change_password">
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <div class="position-relative">
            <input id="facultyCurrentPassword" type="password" name="current_password" class="form-control pe-5" required>
            <button type="button" class="password-toggle-btn" onclick="togglePassword('facultyCurrentPassword','facultyCurrentPasswordIcon')">
              <i id="facultyCurrentPasswordIcon" class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="position-relative">
            <input id="facultyNewPassword" type="password" name="new_password" class="form-control pe-5" required>
            <button type="button" class="password-toggle-btn" onclick="togglePassword('facultyNewPassword','facultyNewPasswordIcon')">
              <i id="facultyNewPasswordIcon" class="bi bi-eye"></i>
            </button>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;">Min 6 characters</div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="position-relative">
            <input id="facultyConfirmPassword" type="password" name="confirm_password" class="form-control pe-5" required>
            <button type="button" class="password-toggle-btn" onclick="togglePassword('facultyConfirmPassword','facultyConfirmPasswordIcon')">
              <i id="facultyConfirmPasswordIcon" class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="submit" class="btn btn-primary">Update Password</button>
          <a href="/faculty/profile" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
