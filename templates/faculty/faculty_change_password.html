{% extends "components/base.html" %}
{% block title %}Change Password — EduSphere{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block page_sub %}Update your account password{% endblock %}

{% block content %}
<div class="max-w-md" style="margin:0 auto;">
  <div class="card">
    <div class="card-head"><h5>Change Password</h5></div>
    <div class="card-body">
      <form method="POST" action="/faculty/change_password">
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="current_password" name="current_password" class="form-control" required>
            <i id="current-password-toggle-icon" class="bi bi-eye password-toggle-icon" onclick="togglePassword('current_password', 'current-password-toggle-icon')"></i>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="new_password" name="new_password" class="form-control" required>
            <i id="new-password-toggle-icon" class="bi bi-eye password-toggle-icon" onclick="togglePassword('new_password', 'new-password-toggle-icon')"></i>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;">Min 6 characters</div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            <i id="confirm-password-toggle-icon" class="bi bi-eye password-toggle-icon" onclick="togglePassword('confirm_password', 'confirm-password-toggle-icon')"></i>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="submit" class="btn btn-primary">Update Password</button>
          <a href="/faculty/profile" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
